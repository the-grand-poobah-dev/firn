name: CI
on:
  push:
    branches:
      - "feat/**"
      - "feature/**"
      - "chore/**"
  pull_request:
    branches: [main, chore/release]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Upload generated lockfile for reproducible release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firn-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: warn
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
